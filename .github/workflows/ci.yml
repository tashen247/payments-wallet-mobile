name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet
          POSTGRES_DB: wallet
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wallet" --health-interval 2s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://wallet:wallet@localhost:5432/wallet
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test with coverage
        run: pnpm -r --workspace-concurrency=1 test:coverage
      - name: Migrate, seed 10k transactions and check p95 latency
        run: |
          pnpm db:migrate
          SEED_TRANSACTIONS=10000 pnpm db:seed
          pnpm --filter @wallet/api bench
      - name: CDK synth
        run: pnpm synth
